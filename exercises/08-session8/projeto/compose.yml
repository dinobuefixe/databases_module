services:

  app:
    build: .
    container_name: app_session8
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres1:
        condition: service_healthy
      postgres2:
        condition: service_healthy

  postgres1:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres1
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql
      - ./sql/postgres1:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres2:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres2
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql
      - ./sql/postgres2:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres2"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app:
  postgres1_data:
  postgres2_data:
